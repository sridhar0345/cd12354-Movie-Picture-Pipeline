name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test

  build:
    name: Build and Push
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Pull backend base image
        run: |
          for i in 1 2 3 4 5; do
            if docker pull public.ecr.aws/docker/library/python:3.10-alpine3.18; then
              exit 0
            fi
            echo "Base image pull failed. Retrying in 30 seconds..."
            sleep 30
          done

          echo "Unable to pull backend base image after 5 attempts."
          exit 1

      - name: Build Docker image
        working-directory: starter/backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy backend
        working-directory: starter/backend/k8s
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/backend:${{ github.sha }}
        run: |
          kustomize edit set image backend="$IMAGE"
          kustomize build | kubectl apply -f -

      - name: Check backend pods
        run: |
          sleep 15
          kubectl get deployment backend
          kubectl get pods -l app=backend -o wide
          kubectl get service backend

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend --timeout=10m

      - name: Diagnose backend if deployment fails
        if: failure()
        run: |
          echo "=== PODS ==="
          kubectl get pods -l app=backend -o wide

          echo "=== DEPLOYMENT ==="
          kubectl describe deployment backend

          echo "=== POD DESCRIPTION ==="
          kubectl describe pods -l app=backend

          echo "=== POD LOGS ==="
          kubectl logs -l app=backend --tail=100 --all-containers=true

          echo "=== EVENTS ==="
          kubectl get events --sort-by=.lastTimestamp | tail -50

      - name: Verify backend service
        run: |
          kubectl get deployment backend
          kubectl get service backends